
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Τρικαλινή Λέσχη Προβληματισμού</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f4f7;
    color: #333;
    margin: 0;
    padding: 20px 12px;
}

.container {
    max-width: 600px;
    margin: 20px auto;
    padding: 25px 20px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    width: 150px;
    max-width: 55%;
    height: auto;
}

h1 {
    font-size: 25px;
    line-height: 1.4;
}

h2 {
    font-size: 22px;
    font-weight: bold; 
    color: #345b78;
}

p {
    font-size: 17px;
    line-height: 1.5;
}

label {
    display: block;
    font-size: 18px;
    font-weight: bold;
    margin: 20px 0 8px;
}

input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    font-size: 18px;
    border: 1px solid #bbb;
    border-radius: 7px;
    font-family: Arial, sans-serif;
}

textarea {
    min-height: 140px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #345b78;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 19px;
    cursor: not-allowed;
    opacity: 0.7;
}

.note {
    font-size: 15px;
    color: #666;
    margin-top: 20px;
}
</style>
</head>

<body>
<div class="container">
<header>
    <img src="logo.png" class="logo"
         alt="Λογότυπο Λέσχης">
    <h1>Τρικαλινή Λέσχη Προβληματισμού</h1>
    <h2>Υποβολή ερώτησης</h2>
</header>

 <!-- <p>
Καλώς ήρθατε!
</p>  -->
<p>
Μπορείτε να υποβάλετε την ερώτησή σας προς τον ομιλητή.
</p>
<form>
    <label for="question">Η ερώτησή σας </label>
    <textarea id="question"
        placeholder="Γράψτε εδώ την ερώτησή σας..."
        required></textarea>
 <!--     <label for="name">Ονοματεπώνυμο (προαιρετικό)</label>  -->
    <br><br>
    <input type="text" id="name"
        placeholder="Ονοματεπώνυμο (προαιρετικό)">  <!-- "Το όνομά σας" -->
  <!--    <label for="job">Επάγγελμα (προαιρετικό)</label>  -->
      <br>  <br>
    <input type="text" id="job"
        placeholder="Επάγγελμα (προαιρετικό)"> <!-- "Το επάγγελμά σας" -->
    <button type="button" disabled>
        Η υποβολή θα ενεργοποιηθεί σύντομα
    </button>
</form>
<!--
<p class="note">
Η αναγραφή του ονόματος και του επαγγέλματος
είναι προαιρετική.
</p>
 -->
</div>

</body>
</html>
