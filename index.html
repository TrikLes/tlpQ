
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Τρικαλινή Λέσχη Προβληματισμού</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .logo {
            width: 180px;
            max-width: 65%;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 27px;
            line-height: 1.4;
            color: #333;
        }

        h2 {
            font-size: 21px;
            font-weight: normal;
            color: #555;
            margin-top: 25px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="logo.png" alt="Λογότυπο Τρικαλινής Λέσχης Προβληματισμού"
             class="logo">

        <h1>Τρικαλινή Λέσχη Προβληματισμού</h1>

        <h2>Σύστημα υποβολής ερωτήσεων</h2>

        <p>
            Καλώς ήρθατε!
        </p>

        <p>
            Μέσω αυτής της εφαρμογής μπορείτε να υποβάλετε
            τις ερωτήσεις σας προς τον ομιλητή.
        </p>

    </div>

</body>
</html>
